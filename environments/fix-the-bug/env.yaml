name: fix-the-bug
description: >
  A small Python statistics module with a bug. The grader runs hidden test
  cases against the submitted repository; reward = fraction of hidden cases
  passed.
sandbox:
  image: python:3.12-alpine
  cpus: 1
  memory: 256Mi
  pids: 64
  disk: 32Mi
  inodes: 4000
  lifetime: 15m
limits:
  max_files: 200
  max_bytes: 2Mi
  max_file_bytes: 1Mi
  max_depth: 8
tasks:
  - id: median
    instructions: |
      The repository at /workspace/repo contains `stats.py`, a tiny statistics
      module, and a few visible unit tests (`python3 -m unittest -q` from the
      repo directory). Users report that `median` returns wrong answers.
      Fix the bug(s) in `stats.py` without changing the public API, then call
      the `submit` tool. Your repository will be graded by hidden tests.
    files: tasks/median/files
    hidden: tasks/median/hidden
    files_dest: /workspace
    submission: /workspace/repo
    setup:
      - run: chown -R 1000:1000 /workspace
    grader:
      command: ["python3", "-I", "/grader/grade.py", "/submission/repo"]
      timeout: 90s
    time_limit: 10m
    max_steps: 40

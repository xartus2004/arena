name: mini-crm
description: >
  A tiny HTTP CRM backed by SQLite, running inside the sandbox as a separate
  service user. The agent must make specific data changes through the API;
  the grader checks the final database (taken into custody after the service
  is stopped) against hidden expectations.
sandbox:
  image: python:3.12-alpine
  cpus: 1
  memory: 256Mi
  pids: 64
  disk: 32Mi
  inodes: 2000
  lifetime: 15m
limits:
  max_files: 10
  max_bytes: 4Mi
  max_depth: 2
tasks:
  - id: update-customers
    instructions: |
      A CRM service is running at http://127.0.0.1:8080 (see /workspace/srv/API.md;
      `python3` is available, curl is not). Make exactly these changes through
      the API, then call `submit`:
        1. Change Ada Lovelace's email to ada@analytical.engine
        2. Move Grace Hopper to the "enterprise" tier
        3. Delete the customer "Mallory Spam"
        4. Add a customer: name "Katherine Johnson", email katherine@nasa.gov, tier "pro"
      Do not modify any other customer.
    files: tasks/update-customers/files
    hidden: tasks/update-customers/hidden
    files_dest: /workspace
    submission: /workspace/data
    kill_users: [service]
    setup:
      - run: mkdir -p /workspace/data && chown 1001:1001 /workspace/data && chmod 700 /workspace/data
      - run: python3 /workspace/srv/seed.py /workspace/data/crm.db
        user: service
      - run: nohup python3 /workspace/srv/server.py /workspace/data/crm.db </dev/null >/tmp/crm.log 2>&1 &
        user: service
      - run: for i in $(seq 1 100); do wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0; sleep 0.1; done; exit 1
        user: student
    grader:
      command: ["python3", "-I", "/grader/grade.py", "/submission/data/crm.db"]
      timeout: 60s
    time_limit: 10m
    max_steps: 30
